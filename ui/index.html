<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpiderGuard</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="timer" aria-selected="true">Timer</button>
    <button role="tab" data-view="rules" aria-selected="false">Rules</button>
    <button role="tab" data-view="stats" aria-selected="false">Today</button>
  </nav>
  <main>
    <section id="view-timer" class="view" role="tabpanel">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle class="ring-fill" id="ring" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="ring-text" role="timer" aria-live="off">
          <div id="clock" class="clock">25:00</div>
          <div id="phase" class="phase">Ready</div>
        </div>
      </div>
      <div id="rounds" class="rounds" role="img" aria-label="Sessions this cycle"></div>
      <div id="setup" class="controls">
        <select id="minutes" aria-label="Session length">
          <option value="15">15 min</option><option value="25" selected>25 min</option>
          <option value="45">45 min</option><option value="60">60 min</option><option value="90">90 min</option>
        </select>
        <label><input type="checkbox" id="strict"> Strict</label>
        <button id="start" class="primary">Start</button>
      </div>
      <div id="running" class="controls" hidden>
        <button id="hold" class="quiet hold"><span class="hold-fill"></span><span class="hold-label">Hold 10s to end early</span></button>
        <p id="strict-note" class="hint" hidden>Strict session: no way out until it ends.</p>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </section>
    <section id="view-rules" class="view" role="tabpanel" hidden></section>
    <section id="view-stats" class="view" role="tabpanel" hidden></section>
  </main>
  <script src="js/bridge.js"></script>
  <script src="js/chime.js"></script>
  <script src="js/ring.js"></script>
  <script src="js/hold.js"></script>
  <script src="js/timer-view.js"></script>
  <script src="js/rules-view.js"></script>
  <script src="js/stats-view.js"></script>
  <script src="js/tabs.js"></script>
</body>
</html>
